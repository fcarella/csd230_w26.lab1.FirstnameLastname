<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Order Confirmation</title></head>
<body>
<h1>Order Confirmation</h1>

<div th:if="${order}">
    <p><b>Order ID:</b> <span th:text="${order.id}"></span></p>
    <p><b>Order Date:</b> <span th:text="${order.orderDate}"></span></p>
    <p><b>Total Paid:</b> $<span th:text="${order.totalAmount}"></span></p>

    <h3>Items Purchased</h3>
    <table border="1">
        <thead>
        <tr><th>Item</th><th>Type</th><th>Price</th></tr>
        </thead>
        <tbody>
        <tr th:each="product : ${order.products}">
            <td>
                <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                      th:text="${product.title}"></span>
                <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                      th:text="${product.description}"></span>
                <span th:if="${product instanceof T(csd230.lab1.entities.ElectronicsEntity)}"
                      th:text="${product.brand}"></span>
            </td>
            <td th:text="${product.productType}"></td>
            <td th:text="${product.price}"></td>
        </tr>
        </tbody>
    </table>
</div>

<p>
    <a th:href="@{/books}">Back to Book List</a> |
    <a th:href="@{/cart}">View Cart</a>
</p>
</body>
</html>
