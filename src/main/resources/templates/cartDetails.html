<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Shopping Cart</title></head>
<body>
<h1>Your Shopping Cart</h1>

<div th:if="${error}">
    <p style="color:red;" th:text="${error}"></p>
</div>

<div th:if="${cart == null || cart.products.empty}">
    <p>Your cart is empty.</p>
</div>

<table border="1" th:unless="${cart == null || cart.products.empty}">
    <thead>
    <tr>
        <th>Item</th><th>Type</th><th>Price</th><th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${cart.products}">
        <td>
            <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                  th:text="${product.title}"></span>
            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
            <span th:if="${product instanceof T(csd230.lab1.entities.ElectronicsEntity)}"
                  th:text="${product.brand}"></span>
        </td>
        <td th:text="${product.productType}"></td>
        <td th:text="${product.price}"></td>
        <td><a th:href="@{/cart/remove/{id}(id=${product.id})}">Remove</a></td>
    </tr>
    </tbody>
</table>

<br>
<div th:unless="${cart == null || cart.products.empty}">
    <form th:action="@{/cart/checkout}" method="post">
        <button type="submit">Checkout</button>
    </form>
</div>

<p><a th:href="@{/books}">Continue Shopping</a></p>
</body>
</html>
