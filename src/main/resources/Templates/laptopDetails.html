<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Laptop Details</title>
</head>
<body>
<h1>Laptop Details</h1>
<div th:if="${laptop}">
    <p><strong>ID:</strong> <span th:text="${laptop.id}"></span></p>
    <p><strong>Brand:</strong> <span th:text="${laptop.brand}"></span></p>
    <p><strong>Description:</strong> <span th:text="${laptop.description}"></span></p>
    <p><strong>Price ($):</strong> <span th:text="${laptop.price}"></span></p>
    <p><strong>RAM (GB):</strong> <span th:text="${laptop.ramGb}"></span></p>
</div>
<div th:unless="${laptop}">
    <p>No laptop found with the requested ID.</p>
</div>
<br/>
<a th:href="@{/laptops}">Back to Catalog</a>
</body>
</html>
